  <style>
  :root {
    color-scheme: light;
    --background: #ffffff;
    --foreground: #17211e;
    --muted: #e9eef1;
    --muted-foreground: #65736f;
    --border: #d7dfdc;
    --viz-series-1: #3b82c4;
    --viz-series-2: #ef7d32;
    --font-size-base: 15px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--background);
    color: var(--foreground);
    font-family: Arial, Helvetica, sans-serif;
  }

  body { padding: 16px; }

  .viz-controls {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    align-items: end;
  }

  .form-label {
    display: grid;
    gap: 6px;
    color: var(--foreground);
    font-size: 0.9rem;
    font-weight: 700;
  }

  .search-field { grid-column: 1 / -1; }

  .form-select,
  .form-input {
    width: 100%;
    min-height: 42px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--background);
    color: var(--foreground);
    font: inherit;
  }

  .viz-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
  }

  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #f7f9f8;
  }

  .text-muted { color: var(--muted-foreground); }
  .tabular-nums { font-variant-numeric: tabular-nums; }

  @media (max-width: 760px) {
    body { padding: 10px; }
    .viz-controls { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="election-map-litoral-pr">
  <h2>Locais de votação — Presidente, 1º turno</h2>
  <p class="map-source">Fonte dos dados eleitorais: <a href="https://dadosabertos.tse.jus.br/group/resultados" target="_blank" rel="noopener">Boletins de Urna do 1º turno de 2026, Portal de Dados Abertos do TSE</a>.</p>
  <div class="viz-controls" aria-label="Filtros do mapa">
    <label class="form-label search-field" for="map-search">Busca geral
      <input class="form-input" id="map-search" type="search" autocomplete="off" placeholder="Escola, local, município, bairro, endereço ou número">
    </label>
    <label class="form-label" for="map-city">Município
      <select class="form-select" id="map-city">
        <option value="Todos">Todos</option>
        <option value="Guaratuba">Guaratuba</option>
        <option value="Matinhos">Matinhos</option>
        <option value="Paranaguá">Paranaguá</option>
        <option value="Pontal Do Paraná">Pontal do Paraná</option>
      </select>
    </label>
    <label class="form-label" for="map-metric">Indicador
      <select class="form-select" id="map-metric">
        <option value="abstencoes">Abstenções — quantidade</option>
        <option value="taxa_abstencao">Abstenções — taxa</option>
        <option value="brancos_mais_nulos">Brancos + nulos — quantidade</option>
        <option value="taxa_brancos_nulos">Brancos + nulos — taxa</option>
      </select>
    </label>
    <label class="form-label" for="map-location">Local selecionado
      <select class="form-select" id="map-location"></select>
    </label>
  </div>
  <div class="map-stage">
    <div class="map-zoom-controls" aria-label="Controles de zoom do mapa">
      <button id="map-zoom-in" type="button" aria-label="Aproximar mapa" title="Aproximar">+</button>
      <button id="map-zoom-out" type="button" aria-label="Afastar mapa" title="Afastar">−</button>
      <button id="map-zoom-reset" type="button" aria-label="Redefinir zoom do mapa" title="Redefinir zoom">↺</button>
    </div>
    <svg role="img" aria-labelledby="map-title map-description">
      <title id="map-title">Mapa dos locais de votação do litoral do Paraná</title>
      <desc id="map-description">Os círculos representam locais de votação. O tamanho mostra o indicador selecionado e a cor destaca os cinco primeiros de cada município.</desc>
    </svg>
    <div class="map-popup" id="map-popup" role="dialog" aria-label="Informações do local de votação" hidden>
      <button class="map-popup-close" id="map-popup-close" type="button" aria-label="Fechar informações do local">×</button>
      <div id="map-popup-content"></div>
    </div>
  </div>
  <div class="viz-row map-legend" aria-label="Legenda">
    <span><span class="legend-dot legend-top"></span>Top 5 no município</span>
    <span><span class="legend-dot legend-other"></span>Demais locais</span>
    <span id="size-legend" class="text-muted tabular-nums"></span>
  </div>
  <div class="card map-detail" id="map-detail" aria-live="polite"></div>
</div>

        .attr("data-base-radius", (d) => radius(d[metric]))
        .attr("r", (d) => radius(d[metric]) / currentZoom.k)
        .attr("role", "button")
        .attr("aria-label", (d) => `${d.nome_local}, ${d.municipio}. Abstenções: ${formatter.format(d.abstencoes)}, ${percent.format(d.taxa_abstencao)}. Brancos e nulos: ${formatter.format(d.brancos_mais_nulos)}, ${percent.format(d.taxa_brancos_nulos)}.`)
        .attr("data-tooltip", (d) => `${d.nome_local} · ${metrics[metric].label}: ${metrics[metric].format(d[metric])}`)
        .on("click", selectLocation);
  
      updateDetail(list.find((d) => d.key === selectedKey));
      const popupLocation = list.find((d) => d.key === popupKey);
      if (popupLocation) showPopup(popupLocation); else closePopup();
    }
  
    function resetZoom({ animate = true } = {}) {
      const target = animate ? svg.transition().duration(220) : svg;
      target.call(zoomBehavior.transform, d3.zoomIdentity);
    }

    zoomInButton.addEventListener("click", () => svg.transition().duration(180).call(zoomBehavior.scaleBy, 1.4));
    zoomOutButton.addEventListener("click", () => svg.transition().duration(180).call(zoomBehavior.scaleBy, 1 / 1.4));
    zoomResetButton.addEventListener("click", () => resetZoom());

    popupCloseButton.addEventListener("click", () => { popupKey = null; closePopup(); });
    window.addEventListener("keydown", (event) => { if (event.key === "Escape" && !popup.hidden) { popupKey = null; closePopup(); } });
    searchInput.addEventListener("input", () => { selectedKey = null; popupKey = null; resetZoom({ animate: false }); draw(); saveState(); });
    citySelect.addEventListener("change", () => { selectedKey = null; popupKey = null; resetZoom({ animate: false }); draw(); saveState(); });
    metricSelect.addEventListener("change", () => { resetZoom({ animate: false }); draw(); saveState(); });
    locationSelect.addEventListener("change", () => { selectedKey = locationSelect.value; popupKey = selectedKey; draw(); saveState(); });
    window.addEventListener("openai:set_globals", (event) => {
      const state = event.detail?.globals?.widgetState?.privateContent;
      if (!state) return;
      if (typeof state.search === "string") searchInput.value = state.search;
      if ([...citySelect.options].some((o) => o.value === state.city)) citySelect.value = state.city;
      if (metrics[state.metric]) metricSelect.value = state.metric;
      selectedKey = state.localKey || null;
      popupKey = null;
      draw();
    });
  
    let resizeFrame = 0;
    const scheduleDraw = () => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(draw);
    };
    if (typeof ResizeObserver === "function") {
      const resizeObserver = new ResizeObserver(scheduleDraw);
      resizeObserver.observe(root.querySelector(".map-stage"));
    } else {
      window.addEventListener("resize", scheduleDraw, { passive: true });
    }
    draw();
  };

  if (window.d3) {
    start();
    return;
  }

  const d3Script = document.getElementById("election-map-d3");
  if (!d3Script) {
    showLoadError();
    return;
  }
  d3Script.addEventListener("load", start, { once: true });
  d3Script.addEventListener("error", showLoadError, { once: true });
})();
</script>

</body>
</html>
